name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Kontrola, testy i build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-secret-0123456789
          DATABASE_URL: postgres://ci:ci@localhost/ci

  db:
    name: Testy z bazą (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zielnik_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/zielnik_test

  e2e:
    name: E2E na telefonie i budżety wydajności
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      ZIELNIK_LOCAL_PG: '1' # build z aliasem Neon -> pg (scripts/dev/build-local.sh)
      AUTH_SECRET: ci-build-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Testy E2E (390 px)
        run: npm run test:e2e
      - name: Budżety Lighthouse (tests/perf/budgets.json)
        # do pierwszych pomiarów na runnerze GitHuba tylko ostrzeżenie (progi skalibrowane lokalnie)
        continue-on-error: true
        # lighthouse tylko w CI (nie w devDependencies: Vercel instalowałby go przy każdym wdrożeniu)
        run: |
          npm i --no-save lighthouse@12.8.2 chrome-launcher@1.2.2
          E2E_SKIP_BUILD=1 npm run test:perf
      - name: Zrzuty z nieudanych testów
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-zrzuty
          path: |
            zrzuty/e2e
            zrzuty/lighthouse
          if-no-files-found: ignore
          retention-days: 7
