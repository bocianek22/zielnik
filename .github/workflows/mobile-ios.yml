name: Aplikacja iOS (symulator)

# Kontrolny build powłoki iOS bez podpisu (na symulator). Podpis i TestFlight wymagają konta Apple Developer
# (99 USD/rok) i są opisane jako następny krok w mobile/README.md.
on:
  workflow_dispatch:
    inputs:
      zielnik_url:
        description: 'Adres aplikacji webowej (puste = zmienna repozytorium ZIELNIK_URL albo domyślny z mobile/capacitor.config.js)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  simulator:
    name: Build na symulator
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      ZIELNIK_URL: ${{ inputs.zielnik_url || vars.ZIELNIK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Capacitor 8 potrzebuje aktualnego Xcode (Swift Package Manager, iOS 15+)
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: npm ci

      - name: Projekt iOS (gdyby go nie było w repozytorium)
        run: test -d ios || npx cap add ios

      - run: npm run sync:ios

      - name: xcodebuild (symulator, bez podpisu)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build

      - name: Spakuj aplikację na symulator
        run: |
          cd "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator"
          zip -qry "$RUNNER_TEMP/Zielnik-simulator.zip" App.app

      - uses: actions/upload-artifact@v4
        with:
          name: zielnik-ios-simulator-${{ github.run_number }}
          path: ${{ runner.temp }}/Zielnik-simulator.zip
          retention-days: 14
